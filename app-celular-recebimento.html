<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IMAC — Recebimento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a1a2e; --blue:#4fc3f7; --green:#43c59e; --red:#ef5350; --gray:#6b7a99; --light:#f0f2f5; --border:#dde3ee;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--light);color:var(--navy);min-height:100vh;font-size:15px}
header{background:var(--navy);color:#fff;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{font-size:17px;font-weight:700;letter-spacing:.03em}
.logo span{color:var(--blue)}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:52px;z-index:100}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--navy);border-bottom-color:var(--blue)}
.screen{display:none;padding:16px}
.screen.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--border)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';display:block;width:3px;height:13px;background:var(--blue);border-radius:2px}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:200px}
.scan-result{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f0fdf8;border:1.5px solid var(--green);border-radius:8px;margin-top:10px;font-size:13px;font-weight:600;color:#1a4a3a;font-family:monospace}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}
input,select{border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;font-size:15px;color:var(--navy);background:#fff;width:100%}
input:focus{outline:none;border-color:var(--blue);background:#f8fdff}
.btn{border:none;border-radius:10px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;width:100%;display:block;text-align:center}
.btn-primary{background:var(--navy);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:#fff;color:var(--gray);border:1.5px solid var(--border)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;opacity:0;transition:all .25s;z-index:999}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">IMAC <span>·</span> Estoque</div>
  <div style="font-size:11px;color:#43c59e" id="status-fb">Nuvem ativa</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('scan')">📷 Bipar</div>
  <div class="tab" onclick="showTab('form')">📝 Dados</div>
  <div class="tab" onclick="showTab('cfg')">⚙️ Config</div>
</div>

<div class="screen active" id="tab-scan">
  <div class="card">
    <div class="card-title">Bipar mercadoria</div>
    <div id="reader"></div>
    <div id="scan-result" style="display:none" class="scan-result">✓ <span id="scan-text">—</span></div>
    <button class="btn btn-primary" style="margin-top:12px" id="btn-iniciar" onclick="iniciarScanner()">Iniciar câmera</button>
  </div>
  <button class="btn btn-green" onclick="showTab('form')" id="btn-ir-form" disabled>Preencher dados →</button>
</div>

<div class="screen" id="tab-form">
  <div class="card">
    <div class="card-title">Informações do produto</div>
    <div class="field"><label>Produto / Descrição *</label><input type="text" id="produto"></div>
    <div class="field"><label>Fornecedor</label><input type="text" id="fornecedor"></div>
  </div>
  <div class="card">
    <div class="card-title">Dados do lote e nota</div>
    <div class="field"><label>Nº da Nota Fiscal *</label><input type="text" id="nf" inputmode="numeric"></div>
    <div class="field"><label>Lote do fornecedor *</label><input type="text" id="lote-forn"></div>
    <div class="field"><label>Validade *</label><input type="date" id="validade"></div>
    <div class="field"><label>Data de recebimento</label><input type="date" id="data-rec"></div>
  </div>
  <div class="card">
    <div class="card-title">Estoque</div>
    <div class="field"><label>Quantidade recebida</label><input type="text" id="quantidade"></div>
    <div class="field"><label>Endereçamento</label><input type="text" id="endereco"></div>
    <div class="field"><label>Responsável</label><input type="text" id="responsavel"></div>
  </div>
  <div class="card">
    <div class="card-title">Cópias</div>
    <div class="field"><label>Quantidade de etiquetas</label><input type="number" id="qtd-etiquetas" value="1" min="1"></div>
  </div>
  <button class="btn btn-green" onclick="dispararFila()">🖨 Enviar para Impressão</button>
</div>

<div class="screen" id="tab-cfg">
  <div class="card">
    <div class="card-title">Configuração</div>
    <p style="font-size:13px;color:var(--gray)">O aplicativo está configurado para enviar impressões diretamente via nuvem ao Firebase integrado.</p>
  </div>
</div>

<div id="toast"></div>

<script>
let codigoAtual = '';
let scanner = null;
let scannerAtivo = false;

const firebaseConfig = {
  apiKey: "AIzaSyCgniZ8fVNdmbzkyfOKGrfXjcKhvX-OIhI",
  authDomain: "etiquetas-84828.firebaseapp.com",
  projectId: "etiquetas-84828",
  storageBucket: "etiquetas-84828.firebasestorage.app",
  messagingSenderId: "820722854531",
  appId: "1:820722854531:web:7d0460a9da17947c5789b6",
  databaseURL: "https://etiquetas-84828-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

document.getElementById('data-rec').value = new Date().toISOString().split('T')[0];

function showTab(nome) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['scan','form','cfg'][i] === nome);
  });
  ['tab-scan','tab-form','tab-cfg'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('tab-' + nome).style.display = 'block';
  if(nome !== 'scan') pararScanner();
}

function iniciarScanner() {
  if (scannerAtivo) { pararScanner(); return; }
  document.getElementById('btn-iniciar').textContent = 'Parar Câmera';
  scanner = new Html5Qrcode("reader");
  scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
    txt => {
      codigoAtual = txt;
      document.getElementById('scan-result').style.display = 'flex';
      document.getElementById('scan-text').textContent = txt;
      document.getElementById('btn-ir-form').disabled = false;
      pararScanner();
    }, 
    () => {}
  ).then(() => scannerAtivo = true);
}

function pararScanner() {
  if (scanner && scannerAtivo) { scanner.stop(); scannerAtivo = false; }
  document.getElementById('btn-iniciar').textContent = 'Iniciar câmera';
}

function v(id){ return (document.getElementById(id).value || '').trim(); }

function dispararFila() {
  if(!v('produto') || !v('nf') || !v('lote-forn') || !v('validade')){
    alert('Preencha os campos obrigatórios!'); return;
  }

  const d = new Date();
  const loteImac = `IMAC-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(1000 + Math.random() * 9000)}`;

  const pacote = {
    loteImac,
    produto: v('produto'),
    fornecedor: v('fornecedor'),
    nf: v('nf'),
    loteForn: v('lote-forn'),
    validade: fmtD(v('validade')),
    dataRec: fmtD(v('data-rec')),
    quantidade: v('quantidade'),
    endereco: v('endereco'),
    responsavel: v('responsavel'),
    timestamp: firebase.database.ServerValue.TIMESTAMP
  };

  const qtd = parseInt(document.getElementById('qtd-etiquetas').value) || 1;
  
  for(let i = 0; i < qtd; i++){
    database.ref('imac-fila-impressao').push(pacote);
  }

  toast('Enviado para a Zebra!');
  limparFormulario();
  showTab('scan');
}

function limparFormulario() {
  ['produto','fornecedor','nf','lote-forn','validade','quantidade','endereco','responsavel'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('btn-ir-form').disabled = true;
  document.getElementById('scan-result').style.display = 'none';
}

function fmtD(iso){
  if(!iso || iso.includes('/')) return iso || '—';
  const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`;
}

function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.className = 'show';
  setTimeout(() => el.className = '', 2500);
}
</script>
</body>
</html>
