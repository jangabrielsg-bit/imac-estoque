<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IMAC — Servidor de Impressão</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:24px;font-size:14px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:1px solid #dde3ee}
h1{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#6b7a99;margin-bottom:20px}
.status{padding:12px 16px;border-radius:8px;font-weight:600;margin-bottom:12px;font-size:14px}
.ok{background:#f0fdf8;color:#1a4a3a;border:1.5px solid #43c59e}
.err{background:#fef2f2;color:#7f1d1d;border:1.5px solid #ef5350}
.warn{background:#fffbeb;color:#78350f;border:1.5px solid #f59e0b}
.log{background:#1a1a2e;color:#4fc3f7;padding:16px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;height:200px;overflow-y:auto;line-height:1.7}
.log .ts{color:#90a0b0}
.log .ok{color:#43c59e;background:none;border:none;padding:0;font-weight:normal}
.log .err{color:#ef5350;background:none;border:none;padding:0;font-weight:normal}
.status-box-fb {background:#f8f9fc;border:1px solid #dde3ee;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:12px;color:#1a1a2e}
</style>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="card">
  <h1>IMAC — Servidor de Impressão</h1>
  <div class="sub">Deixe esta janela aberta. O celular enviará as etiquetas via Nuvem (Firebase).</div>

  <div id="status-box" class="status warn">⏳ Conectando ao banco de dados do Firebase...</div>

  <div class="status-box-fb">
    Projeto Firebase: <strong>etiquetas-84828</strong><br>
    Status da Conexão: <span id="fb-status" style="font-weight:bold;color:#f59e0b">Desconectado</span>
  </div>

  <div style="margin-bottom:8px;font-size:12px;font-weight:600;color:#6b7a99;text-transform:uppercase;letter-spacing:.05em">Log de impressões</div>
  <div class="log" id="log">
    <span class="ts">[sistema]</span> Iniciando monitoramento...<br>
  </div>
</div>

<script>
const log = document.getElementById('log');
const statusBox = document.getElementById('status-box');
const fbStatusSpan = document.getElementById('fb-status');

function addLog(msg, tipo='') {
  const ts = new Date().toLocaleTimeString('pt-BR');
  log.innerHTML += `<span class="ts">[${ts}]</span> <span class="${tipo}">${msg}</span><br>`;
  log.scrollTop = log.scrollHeight;
}

// ── Configuração do Firebase da IMAC ─────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCgniZ8fVNdmbzkyfOKGrfXjcKhvX-OIhI",
  authDomain: "etiquetas-84828.firebaseapp.com",
  projectId: "etiquetas-84828",
  storageBucket: "etiquetas-84828.firebasestorage.app",
  messagingSenderId: "820722854531",
  appId: "1:820722854531:web:7d0460a9da17947c5789b6",
  databaseURL: "https://etiquetas-84828-default-rtdb.firebaseio.com"
};

// Inicializa conexão com o banco de dados
try {
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  
  database.ref('.info/connected').on('value', (snap) => {
    if (snap.val() === true) {
      fbStatusSpan.textContent = "Conectado com Sucesso";
      fbStatusSpan.style.color = "#43c59e";
      statusBox.className = 'status ok';
      statusBox.textContent = '✓ Servidor ativo — Aguardando comandos do celular';
      addLog('Conectado ao Firebase Realtime Database.', 'ok');
    } else {
      fbStatusSpan.textContent = "Desconectado";
      fbStatusSpan.style.color = "#ef5350";
      statusBox.className = 'status err';
      statusBox.textContent = '❌ Desconectado do Firebase.';
    }
  });

  // Ouvinte da fila de impressão
  database.ref('imac-fila-impressao').on('child_added', (snapshot) => {
    const job = snapshot.val();
    const jobId = snapshot.key;

    if (job) {
      processarJob(job);
      // Remove da nuvem para não acumular nem duplicar
      database.ref('imac-fila-impressao/' + jobId).remove();
    }
  });

} catch (error) {
  addLog('Erro ao inicializar Firebase: ' + error.message, 'err');
}

function processarJob(dados) {
  addLog('Recebido da nuvem: ' + (dados.produto || 'Item') + ' — ' + (dados.loteImac || ''), 'ok');
  imprimirEtiqueta(dados);
}

function imprimirEtiqueta(d) {
  // 90×50mm — sem QR code — fontes grandes e nítidas
  const dataHoje = new Date().toLocaleDateString('pt-BR');

  // Gera data de entrada em BR se vier em ISO
  function fmtD(s) {
    if (!s) return '—';
    if (s.includes('/')) return s;
    const [y,m,dia] = s.split('-');
    return dia + '/' + m + '/' + y;
  }

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
/* ── Página: 90×50mm sem margem ── */
@page {
  size: 90mm 50mm;
  margin: 0;
}

/* ── Reset total + prevenção de segunda página ── */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  page-break-before: avoid !important;
  page-break-after:  avoid !important;
  page-break-inside: avoid !important;
  break-before: avoid !important;
  break-after:  avoid !important;
  break-inside: avoid !important;
}

html {
  width: 90mm; height: 50mm;
  max-width: 90mm; max-height: 50mm;
  overflow: hidden;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  width: 90mm; height: 50mm;
  max-width: 90mm; max-height: 50mm;
  overflow: hidden;
  background: #fff; color: #000;
  display: flex; flex-direction: column;
  padding: 1.2mm 2mm 1.2mm 2mm;
  page-break-after: avoid;
  break-after: avoid;
}

/* ── Cabeçalho ── */
.header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1.5pt solid #000; padding-bottom: 0.8mm; margin-bottom: 1.2mm;
  flex-shrink: 0;
}
.empresa { font-size: 7pt; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
.tipo    { font-size: 6.5pt; font-weight: 700; color: #333; }

/* ── Nome do produto ── */
.produto {
  font-size: 15pt; font-weight: 900; line-height: 1.1;
  text-transform: uppercase; letter-spacing: .01em;
  flex-shrink: 0; margin-bottom: 0.8mm;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Lote IMAC em destaque ── */
.lote-bloco {
  display: flex; align-items: center; gap: 3mm;
  margin-bottom: 1.5mm; flex-shrink: 0;
}
.lote-label { font-size: 6pt; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .05em; }
.lote-val {
  background: #000; color: #fff;
  font-size: 9pt; font-weight: 700; font-family: 'Courier New', monospace;
  padding: 0.5mm 2mm; letter-spacing: .04em;
}

/* ── Grade de campos (2 colunas) ── */
.grid {
  display: grid; grid-template-columns: 1fr 1fr;
  column-gap: 4mm; row-gap: 1mm;
  flex: 1; min-height: 0; overflow: hidden;
}
.campo { display: flex; flex-direction: column; min-width: 0; }
.campo-lbl {
  font-size: 5.5pt; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; color: #666; line-height: 1;
}
.campo-val {
  font-size: 8.5pt; font-weight: 700; color: #000; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.campo-val.destaque { font-size: 10pt; font-weight: 900; }

/* ── Rodapé ── */
.footer {
  border-top: 1pt solid #000; padding-top: 0.8mm; margin-top: 1mm;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.footer span { font-size: 6.5pt; color: #333; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <span class="empresa">IMAC — Controle de Estoque</span>
  <span class="tipo">Rastreabilidade de Insumos</span>
</div>

<div class="produto">${d.produto || '—'}</div>

<div class="lote-bloco">
  <span class="lote-label">Lote IMAC</span>
  <span class="lote-val">${d.loteImac || '—'}</span>
</div>

<div class="grid">
  <div class="campo">
    <div class="campo-lbl">Lote Fornecedor</div>
    <div class="campo-val">${d.loteForn || '—'}</div>
  </div>
  <div class="campo">
    <div class="campo-lbl">Nota Fiscal</div>
    <div class="campo-val">${d.nf || '—'}</div>
  </div>
  <div class="campo">
    <div class="campo-lbl">Fornecedor</div>
    <div class="campo-val">${(d.fornecedor || '—').slice(0,22)}</div>
  </div>
  <div class="campo">
    <div class="campo-lbl">Validade</div>
    <div class="campo-val destaque">${d.validade || '—'}</div>
  </div>
  <div class="campo">
    <div class="campo-lbl">Quantidade</div>
    <div class="campo-val">${d.quantidade || '—'}</div>
  </div>
  <div class="campo">
    <div class="campo-lbl">Endereço / Local</div>
    <div class="campo-val">${d.endereco || '—'}</div>
  </div>
</div>

<div class="footer">
  <span>${d.responsavel ? 'Op: ' + d.responsavel + '  ·  ' : ''}IMAC · Rastreabilidade</span>
  <span>Entrada: ${fmtD(d.dataRec)}  ·  Impresso: ${dataHoje}</span>
</div>

<script>
  // Aguarda DOM pronto e imprime
  (function() {
    function doprint() {
      // Força o layout a 90x50mm antes de imprimir
      document.documentElement.style.width  = '90mm';
      document.documentElement.style.height = '50mm';
      document.body.style.width  = '90mm';
      document.body.style.height = '50mm';
      window.print();
    }
    if (document.readyState === 'complete') { setTimeout(doprint, 200); }
    else { window.onload = function() { setTimeout(doprint, 200); }; }
  })();
<\/script>
</body></html>`;

  // Blob URL: abre direto no conteúdo, sem página em branco inicial
  const blob    = new Blob([html], { type: 'text/html; charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);
  const w       = window.open(blobUrl, '_blank', 'width=10,height=10,left=-500,top=-500');

  if (!w) {
    addLog('ERRO: Pop-ups bloqueados. Acesse chrome://settings/content/popups e adicione localhost.', 'err');
    URL.revokeObjectURL(blobUrl);
    return;
  }

  setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
}
</script>
</body>
</html>
