<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IMAC — Servidor de Impressão</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:24px;font-size:14px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:1px solid #dde3ee}
h1{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#6b7a99;margin-bottom:20px}
.status{padding:12px 16px;border-radius:8px;font-weight:600;margin-bottom:12px;font-size:14px}
.ok{background:#f0fdf8;color:#1a4a3a;border:1.5px solid #43c59e}
.err{background:#fef2f2;color:#7f1d1d;border:1.5px solid #ef5350}
.warn{background:#fffbeb;color:#78350f;border:1.5px solid #f59e0b}
.log{background:#1a1a2e;color:#4fc3f7;padding:16px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;height:200px;overflow-y:auto;line-height:1.7}
.log .ts{color:#90a0b0}
.log .ok{color:#43c59e;background:none;border:none;padding:0;font-weight:normal}
.log .err{color:#ef5350;background:none;border:none;padding:0;font-weight:normal}
.status-box-fb {background:#f8f9fc;border:1px solid #dde3ee;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:12px;color:#1a1a2e}
</style>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="card">
  <h1>IMAC — Servidor de Impressão</h1>
  <div class="sub">Deixe esta janela aberta. O celular enviará as etiquetas via Nuvem (Firebase).</div>

  <div id="status-box" class="status warn">⏳ Conectando ao banco de dados do Firebase...</div>

  <div class="status-box-fb">
    Projeto Firebase: <strong>etiquetas-84828</strong><br>
    Status da Conexão: <span id="fb-status" style="font-weight:bold;color:#f59e0b">Desconectado</span>
  </div>

  <div style="margin-bottom:8px;font-size:12px;font-weight:600;color:#6b7a99;text-transform:uppercase;letter-spacing:.05em">Log de impressões</div>
  <div class="log" id="log">
    <span class="ts">[sistema]</span> Iniciando monitoramento...<br>
  </div>
</div>

<script>
const log = document.getElementById('log');
const statusBox = document.getElementById('status-box');
const fbStatusSpan = document.getElementById('fb-status');

function addLog(msg, tipo='') {
  const ts = new Date().toLocaleTimeString('pt-BR');
  log.innerHTML += `<span class="ts">[${ts}]</span> <span class="${tipo}">${msg}</span><br>`;
  log.scrollTop = log.scrollHeight;
}

// ── Configuração do Firebase da IMAC ─────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCgniZ8fVNdmbzkyfOKGrfXjcKhvX-OIhI",
  authDomain: "etiquetas-84828.firebaseapp.com",
  projectId: "etiquetas-84828",
  storageBucket: "etiquetas-84828.firebasestorage.app",
  messagingSenderId: "820722854531",
  appId: "1:820722854531:web:7d0460a9da17947c5789b6",
  databaseURL: "https://etiquetas-84828-default-rtdb.firebaseio.com"
};

// Inicializa conexão com o banco de dados
try {
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  
  database.ref('.info/connected').on('value', (snap) => {
    if (snap.val() === true) {
      fbStatusSpan.textContent = "Conectado com Sucesso";
      fbStatusSpan.style.color = "#43c59e";
      statusBox.className = 'status ok';
      statusBox.textContent = '✓ Servidor ativo — Aguardando comandos do celular';
      addLog('Conectado ao Firebase Realtime Database.', 'ok');
    } else {
      fbStatusSpan.textContent = "Desconectado";
      fbStatusSpan.style.color = "#ef5350";
      statusBox.className = 'status err';
      statusBox.textContent = '❌ Desconectado do Firebase.';
    }
  });

  // Ouvinte da fila de impressão
  database.ref('imac-fila-impressao').on('child_added', (snapshot) => {
    const job = snapshot.val();
    const jobId = snapshot.key;

    if (job) {
      processarJob(job);
      // Remove da nuvem para não acumular nem duplicar
      database.ref('imac-fila-impressao/' + jobId).remove();
    }
  });

} catch (error) {
  addLog('Erro ao inicializar Firebase: ' + error.message, 'err');
}

function processarJob(dados) {
  addLog('Recebido da nuvem: ' + (dados.produto || 'Item') + ' — ' + (dados.loteImac || ''), 'ok');
  imprimirEtiqueta(dados);
}

function imprimirEtiqueta(d) {
  // Gera QR em alta resolução (200px) para melhor qualidade na impressão térmica
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:-9999px;left:-9999px;visibility:hidden';
  document.body.appendChild(div);

  const qrData = [d.loteImac, (d.produto||'').slice(0,20), d.loteForn, d.validade].join('|');

  new QRCode(div, {
    text: qrData || 'IMAC',
    width: 200, height: 200,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  // 600ms garante que o canvas do QR renderizou completamente
  setTimeout(() => {
    const canvas = div.querySelector('canvas');
    const qrSrc  = canvas ? canvas.toDataURL('image/png', 1.0) : '';
    document.body.removeChild(div);

    // ── HTML da etiqueta ─────────────────────────────────────────────
    // Correções aplicadas:
    //  • @page fora do @media print (funciona em todos os browsers)
    //  • html E body com overflow:hidden e altura fixa em 72mm
    //  • Layout 100% flexbox (sem position:absolute que extravasa a página)
    //  • -webkit-print-color-adjust para cores corretas
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@page { size: 72mm 72mm; margin: 0; }
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html {
  width: 72mm; height: 72mm;
  overflow: hidden;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  width: 72mm; height: 72mm;
  overflow: hidden;
  color: #000; background: #fff;
  display: flex; flex-direction: column;
  padding: 2.5mm;
  page-break-after: avoid;
  break-after: avoid;
}
.emp { font-size: 6.5pt; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; border-bottom: 1px solid #000; padding-bottom: 1mm;
  margin-bottom: 1.5mm; display: flex; justify-content: space-between; flex-shrink: 0; }
.content { display: flex; gap: 2.5mm; flex: 1; min-height: 0; overflow: hidden; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.prod { font-size: 10.5pt; font-weight: 700; line-height: 1.15;
  text-transform: uppercase; word-break: break-word;
  margin-bottom: 1.2mm; flex-shrink: 0; }
.lote-tag { background: #000; color: #fff; font-size: 7.5pt; font-weight: 700;
  font-family: 'Courier New', monospace; padding: 0.3mm 1.5mm;
  border-radius: 1px; display: inline-block; margin-bottom: 1.5mm; flex-shrink: 0; }
.rows { flex: 1; overflow: hidden; }
.r { display: flex; margin-bottom: 0.85mm; font-size: 7pt; line-height: 1.25; }
.k { font-weight: 700; color: #555; width: 48px; flex-shrink: 0; font-size: 6pt; }
.v { color: #000; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v.val { font-size: 8.5pt; font-weight: 700; }
.qr-b { width: 22mm; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; gap: 1mm; padding-top: 0.5mm; }
.qr-b img { width: 21mm; height: 21mm; display: block; image-rendering: pixelated; }
.qc { font-size: 5.5pt; text-align: center; font-weight: 700;
  font-family: 'Courier New', monospace; color: #333; line-height: 1.3; }
.foot { border-top: 1px solid #000; padding-top: 1mm; margin-top: 1.5mm;
  font-size: 6.5pt; display: flex; justify-content: space-between; flex-shrink: 0; }
</style>
</head>
<body>
<div class="emp"><span>IMAC — Controle de Estoque</span><span>Rastreabilidade</span></div>
<div class="content">
  <div class="info">
    <div class="prod">${d.produto || '—'}</div>
    <div class="lote-tag">${d.loteImac || '—'}</div>
    <div class="rows">
      <div class="r"><span class="k">Lote forn.</span><span class="v">${d.loteForn || '—'}</span></div>
      <div class="r"><span class="k">NF</span><span class="v">${d.nf || '—'}</span></div>
      ${d.fornecedor ? '<div class="r"><span class="k">Fornecedor</span><span class="v">' + d.fornecedor + '</span></div>' : ''}
      <div class="r"><span class="k">Validade</span><span class="v val">${d.validade || '—'}</span></div>
      ${d.quantidade ? '<div class="r"><span class="k">Qtd.</span><span class="v">' + d.quantidade + '</span></div>' : ''}
      ${d.endereco ? '<div class="r"><span class="k">Local</span><span class="v">' + d.endereco + '</span></div>' : ''}
      <div class="r"><span class="k">Entrada</span><span class="v">${d.dataRec || '—'}</span></div>
      ${d.responsavel ? '<div class="r"><span class="k">Operador</span><span class="v">' + d.responsavel + '</span></div>' : ''}
    </div>
  </div>
  <div class="qr-b">
    ${qrSrc ? '<img src="' + qrSrc + '" alt="QR">' : ''}
    <div class="qc">LOTE IMAC<br>${d.loteImac ? d.loteImac.slice(-6) : '—'}</div>
  </div>
</div>
<div class="foot">
  <span>IMAC · Rastreabilidade</span>
  <span>${new Date().toLocaleDateString('pt-BR')}</span>
</div>
<script>
  // Aguarda a imagem do QR carregar antes de imprimir
  var img = document.querySelector('img');
  if (img && !img.complete) {
    img.onload = function() { setTimeout(function(){ window.print(); }, 200); };
    img.onerror = function() { setTimeout(function(){ window.print(); }, 200); };
  } else {
    setTimeout(function(){ window.print(); }, 300);
  }
<\/script>
</body></html>`;

    // ── Blob URL: abre direto no conteúdo (sem página em branco inicial) ──
    // window.open('', '_blank') → cria janela em branco → browser conta como pág 1
    // URL.createObjectURL(blob) → janela abre JÁ no conteúdo → 1 página apenas
    const blob    = new Blob([html], { type: 'text/html; charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);

    const w = window.open(blobUrl, '_blank', 'width=10,height=10,left=-200,top=-200');
    if (!w) {
      addLog('ERRO: Pop-ups bloqueados! Vá em Configurações do Chrome → Sites → Pop-ups e ative.', 'err');
      URL.revokeObjectURL(blobUrl);
      return;
    }

    // Revoga a URL após 15 segundos (memória)
    setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);

  }, 600);
}
</script>
</body>
</html>
