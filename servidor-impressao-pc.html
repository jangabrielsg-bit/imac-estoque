<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IMAC — Servidor de Impressão</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:24px;font-size:14px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:1px solid #dde3ee}
h1{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#6b7a99;margin-bottom:20px}
.status{padding:12px 16px;border-radius:8px;font-weight:600;margin-bottom:12px;font-size:14px}
.ok{background:#f0fdf8;color:#1a4a3a;border:1.5px solid #43c59e}
.err{background:#fef2f2;color:#7f1d1d;border:1.5px solid #ef5350}
.warn{background:#fffbeb;color:#78350f;border:1.5px solid #f59e0b}
.log{background:#1a1a2e;color:#4fc3f7;padding:16px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;height:200px;overflow-y:auto;line-height:1.7}
.log .ts{color:#90a0b0}
.log .ok{color:#43c59e;background:none;border:none;padding:0;font-weight:normal}
.log .err{color:#ef5350;background:none;border:none;padding:0;font-weight:normal}
.status-box-fb {background:#f8f9fc;border:1px solid #dde3ee;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:12px;color:#1a1a2e}
</style>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="card">
  <h1>IMAC — Servidor de Impressão</h1>
  <div class="sub">Deixe esta janela aberta. O celular enviará as etiquetas via Nuvem (Firebase).</div>

  <div id="status-box" class="status warn">⏳ Conectando ao banco de dados do Firebase...</div>

  <div class="status-box-fb">
    Projeto Firebase: <strong>etiquetas-84828</strong><br>
    Status da Conexão: <span id="fb-status" style="font-weight:bold;color:#f59e0b">Desconectado</span>
  </div>

  <div style="margin-bottom:8px;font-size:12px;font-weight:600;color:#6b7a99;text-transform:uppercase;letter-spacing:.05em">Log de impressões</div>
  <div class="log" id="log">
    <span class="ts">[sistema]</span> Iniciando monitoramento...<br>
  </div>
</div>

<script>
const log = document.getElementById('log');
const statusBox = document.getElementById('status-box');
const fbStatusSpan = document.getElementById('fb-status');

function addLog(msg, tipo='') {
  const ts = new Date().toLocaleTimeString('pt-BR');
  log.innerHTML += `<span class="ts">[${ts}]</span> <span class="${tipo}">${msg}</span><br>`;
  log.scrollTop = log.scrollHeight;
}

const firebaseConfig = {
  apiKey: "AIzaSyCgniZ8fVNdmbzkyfOKGrfXjcKhvX-OIhI",
  authDomain: "etiquetas-84828.firebaseapp.com",
  projectId: "etiquetas-84828",
  storageBucket: "etiquetas-84828.firebasestorage.app",
  messagingSenderId: "820722854531",
  appId: "1:820722854531:web:7d0460a9da17947c5789b6",
  databaseURL: "https://etiquetas-84828-default-rtdb.firebaseio.com"
};

try {
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  
  database.ref('.info/connected').on('value', (snap) => {
    if (snap.val() === true) {
      fbStatusSpan.textContent = "Conectado com Sucesso";
      fbStatusSpan.style.color = "#43c59e";
      statusBox.className = 'status ok';
      statusBox.textContent = '✓ Servidor ativo — Aguardando comandos do celular';
      addLog('Conectado ao Firebase Realtime Database.', 'ok');
    } else {
      fbStatusSpan.textContent = "Desconectado";
      fbStatusSpan.style.color = "#ef5350";
    }
  });

  database.ref('imac-fila-impressao').on('child_added', (snapshot) => {
    const job = snapshot.val();
    const jobId = snapshot.key;

    if (job) {
      processarJob(job);
      database.ref('imac-fila-impressao/' + jobId).remove();
    }
  });

} catch (error) {
  addLog('Erro ao inicializar Firebase: ' + error.message, 'err');
}

function processarJob(dados) {
  addLog('Recebido da nuvem: ' + (dados.produto || 'Item') + ' — ' + (dados.loteImac || ''), 'ok');
  imprimirEtiqueta(dados);
}

function imprimirEtiqueta(d) {
  const div = document.createElement('div');
  div.style.position = 'absolute';
  div.style.left = '-9999px';
  document.body.appendChild(div);

  const qrData = JSON.stringify({
    loteImac: d.loteImac, produto: d.produto, loteForn: d.loteForn,
    nf: d.nf, validade: d.validade, dataRec: d.dataRec,
    endereco: d.endereco, fornecedor: d.fornecedor
  });

  new QRCode(div, {
    text: qrData, width: 75, height: 75,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  setTimeout(() => {
    const canvas = div.querySelector('canvas');
    const qrSrc  = canvas ? canvas.toDataURL('image/png') : '';
    document.body.removeChild(div);

    // Ajuste estrutural do HTML para evitar vazamento de página
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;width:72mm;height:72mm;padding:2mm;color:#000;background:#fff;overflow:hidden}
.emp{font-size:7pt;font-weight:700;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:1mm;margin-bottom:1.5mm}
.layout{display:flex;gap:2mm;align-items:flex-start}
.info{flex:1;min-width:0}
.prod{font-size:12pt;font-weight:700;margin-bottom:1mm;line-height:1.1;text-transform:uppercase;word-wrap:break-word}
.lote-tag{background:#000;color:#fff;font-size:9pt;font-weight:700;font-family:monospace;padding:0.5mm 1.5mm;border-radius:2px;display:inline-block;margin-bottom:1.5mm}
.r{display:flex;margin-bottom:0.8mm;font-size:8pt;line-height:1}
.k{font-weight:700;color:#333;width:55px;flex-shrink:0}
.v{color:#000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr-b{width:22mm;flex-shrink:0;text-align:center}
.qr-b img{width:20mm;height:20mm;display:block;margin:0 auto}
.qc{font-size:6pt;color:#000;text-align:center;margin-top:1mm;font-weight:700}
.foot{border-top:1px solid #000;margin-top:2mm;padding-top:1mm;font-size:6.5pt;display:flex;justify-content:space-between}
@media print{@page{size:72mm 72mm;margin:0}body{padding:2mm}}
</style></head><body>
<div class="emp">IMAC — Controle de Estoque</div>
<div class="layout">
<div class="info">
<div class="prod">${d.produto || '—'}</div>
<div class="lote-tag">${d.loteImac || '—'}</div>
<div class="r"><span class="k">Lote forn.</span><span class="v">${d.loteForn || '—'}</span></div>
<div class="r"><span class="k">NF</span><span class="v">${d.nf || '—'}</span></div>
${d.fornecedor ? `<div class="r"><span class="k">Fornecedor</span><span class="v">${d.fornecedor}</span></div>` : ''}
<div class="r"><span class="k">Validade</span><span class="v" style="font-size:9pt"><b>${d.validade || '—'}</b></span></div>
<div class="r"><span class="k">Qtd.</span><span class="v">${d.quantidade || '—'}</span></div>
<div class="r"><span class="k">Local</span><span class="v">${d.endereco || '—'}</span></div>
<div class="r"><span class="k">Entrada</span><span class="v">${d.dataRec || '—'}</span></div>
${d.responsavel ? `<div class="r"><span class="k">Operador</span><span class="v">${d.responsavel}</span></div>` : ''}
</div>
<div class="qr-b">
${qrSrc ? `<img src="${qrSrc}">` : ''}
<div class="qc">IMAC QR<br>${d.loteImac ? d.loteImac.slice(-4) : '0000'}</div>
</div>
</div>
<div class="foot"><span>IMAC · Rastreabilidade</span><span>${new Date().toLocaleDateString('pt-BR')}</span></div>
<script>window.onload=function(){window.print();setTimeout(function(){window.close()},600)}<\/script>
</body></html>`;

    const w = window.open('', '_blank', 'width=1,height=1');
    if (w) { 
      w.document.write(html); 
      w.document.close(); 
      addLog('Impressão enviada com sucesso.', 'ok'); 
    } else {
      addLog('ERRO: Ative os Pop-ups do navegador!', 'err');
    }
  }, 350);
}
</script>
</body>
</html>
